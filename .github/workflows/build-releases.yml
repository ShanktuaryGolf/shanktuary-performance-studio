name: Build Cross-Platform Standalone Binaries

# Handoff CI validates repository-backed tests before packaging the redesigned app.
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'handoff/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Production test suite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest numpy opencv-python-headless
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth

      - name: Run tests
        env:
          PYTHONPATH: .
          PYTHONUTF8: "1"
        run: |
          # Upstream's real-session-history regression test intentionally reads
          # a non-versioned local user-data file. Run every repository-backed
          # test in CI while leaving that local-only diagnostic test untouched.
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c '
            python -c "import tkinter as tk; root = tk.Tk(); root.update(); root.destroy()" &&
            python -m pytest -q -ra -k "not test_the_gate_on_the_real_session_history"
          '


  build:
    name: Build on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_type: linux
            asset_name: Shanktuary-Studio-Linux-x64.tar.gz
          - os: windows-latest
            artifact_type: windows
            asset_name: Shanktuary-Studio-Windows-x64.zip
          - os: macos-latest
            artifact_type: macos
            asset_name: Shanktuary-Studio-macOS.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest numpy opencv-python-headless

      - name: Install Linux GUI smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth

      - name: Build Executable with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --additional-hooks-dir hooks --noconfirm --onedir --windowed \
            --name shanktuary_performance_studio \
            --icon assets/shanktuary_shield.png \
            --paths src/ui/_legacy \
            --add-data "assets:assets" \
            --add-data "src/analytics/data:src/analytics/data" \
            shanktuary_app.py

      - name: Build Executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --additional-hooks-dir hooks --noconfirm --onedir --windowed --name shanktuary_performance_studio --icon assets/shanktuary_shield.png --paths src/ui/_legacy --add-data "assets;assets" --add-data "src/analytics/data;src/analytics/data" shanktuary_app.py

      - name: Smoke-test frozen Linux desktop
        if: runner.os == 'Linux'
        run: |
          SPS_SMOKE_EXECUTABLE="$PWD/dist/shanktuary_performance_studio/shanktuary_performance_studio" \
            xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q tests/test_packaged_startup.py

      - name: Package Linux Tarball & AppImage
        if: runner.os == 'Linux'
        run: |
          tar -czf Shanktuary-Studio-Linux-x64.tar.gz -C dist shanktuary_performance_studio

          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/shanktuary_performance_studio/* AppDir/usr/bin/
          cp shanktuary_performance_studio.desktop AppDir/
          cp assets/shanktuary_shield.png AppDir/shanktuary_performance_studio.png
          cp assets/shanktuary_shield.png AppDir/usr/share/icons/hicolor/256x256/apps/shanktuary_performance_studio.png

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/shanktuary_performance_studio" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Shanktuary-Studio-x86_64.AppImage

      - name: Smoke-test Linux AppImage
        if: runner.os == 'Linux'
        run: |
          SPS_SMOKE_EXECUTABLE="$PWD/Shanktuary-Studio-x86_64.AppImage" \
            xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q tests/test_packaged_startup.py

      - name: Compress Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist/shanktuary_performance_studio -DestinationPath Shanktuary-Studio-Windows-x64.zip

      - name: Sign and package macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - --timestamp=none dist/shanktuary_performance_studio.app
          codesign --verify --deep --strict --verbose=2 dist/shanktuary_performance_studio.app
          ditto -c -k --sequesterRsrc --keepParent dist/shanktuary_performance_studio.app Shanktuary-Studio-macOS.zip

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            Shanktuary-Studio-x86_64.AppImage
          if-no-files-found: warn

  release:
    name: Publish validated release
    needs: [test, build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'Release v1.8.1: fix Pillow Tk packaging'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.8.1
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate approved version and exact release commit
        id: release_check
        run: |
          python - <<'PYCHECK'
          import ast
          import json
          import os
          from pathlib import Path
          import subprocess

          def api(path, optional=False):
              result = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if result.returncode:
                  if optional and "HTTP 404" in result.stderr:
                      return None
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)

          repo, sha, tag = os.environ["GH_REPO"], os.environ["RELEASE_SHA"], os.environ["RELEASE_TAG"]
          for filename in ("obs_server.py", "shanktuary_performance_studio.py"):
              values = {node.targets[0].id: ast.literal_eval(node.value)
                        for node in ast.parse(Path(filename).read_text()).body
                        if isinstance(node, ast.Assign) and len(node.targets) == 1
                        and isinstance(node.targets[0], ast.Name)
                        and node.targets[0].id in ("APP_VERSION", "BUILD_NUMBER")}
              assert values["APP_VERSION"] == tag, filename
              assert values["BUILD_NUMBER"] == "2026.10.28.1", filename
          head = api(f"repos/{repo}/git/ref/heads/main")
          assert head["object"]["sha"] == sha, "main moved; refuse stale publication"
          ref = api(f"repos/{repo}/git/ref/tags/{tag}", optional=True)
          if ref is not None:
              assert ref["object"]["type"] == "commit" and ref["object"]["sha"] == sha, "tag already targets another commit"
          release = api(f"repos/{repo}/releases/tags/{tag}", optional=True)
          publish = release is None or release["draft"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish={str(publish).lower()}\n")
          PYCHECK

      - name: Download all validated platform packages
        if: steps.release_check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify complete asset set and generate checksums
        if: steps.release_check.outputs.publish == 'true'
        working-directory: release-assets
        run: |
          for file in Shanktuary-Studio-Linux-x64.tar.gz Shanktuary-Studio-Windows-x64.zip Shanktuary-Studio-macOS.zip Shanktuary-Studio-x86_64.AppImage; do
            test -s "$file"
          done
          sha256sum Shanktuary-Studio-Linux-x64.tar.gz Shanktuary-Studio-Windows-x64.zip Shanktuary-Studio-macOS.zip Shanktuary-Studio-x86_64.AppImage > SHA256SUMS.txt

      - name: Stage all packages in a draft after every platform passes
        if: steps.release_check.outputs.publish == 'true'
        id: draft_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.1
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-assets/Shanktuary-Studio-Linux-x64.tar.gz
            release-assets/Shanktuary-Studio-Windows-x64.zip
            release-assets/Shanktuary-Studio-macOS.zip
            release-assets/Shanktuary-Studio-x86_64.AppImage
            release-assets/SHA256SUMS.txt

      - name: Verify uploaded assets and publish the complete release
        if: steps.release_check.outputs.publish == 'true'
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          python - <<'PYVERIFY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def api(path, optional=False):
              result = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if result.returncode:
                  if optional and "HTTP 404" in result.stderr:
                      return None
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)

          repo, sha, tag = os.environ["GH_REPO"], os.environ["RELEASE_SHA"], os.environ["RELEASE_TAG"]
          release = api(f"repos/{repo}/releases/{os.environ['RELEASE_ID']}")
          assert release["draft"] and release["tag_name"] == tag, "Expected approved draft release"
          assert release["target_commitish"] == sha, "Draft targets another commit"
          assert api(f"repos/{repo}/git/ref/heads/main")["object"]["sha"] == sha, "main moved during upload"
          ref = api(f"repos/{repo}/git/ref/tags/{tag}", optional=True)
          if ref is not None:
              assert ref["object"]["type"] == "commit" and ref["object"]["sha"] == sha, "tag changed during upload"
          assets = api(f"repos/{repo}/releases/{os.environ['RELEASE_ID']}/assets")
          expected = {path.name: path for path in Path(".").iterdir() if path.is_file()}
          assert {asset["name"] for asset in assets} == set(expected), "Release asset set mismatch"
          for asset in assets:
              path = expected[asset["name"]]
              assert asset["state"] == "uploaded", asset["name"]
              assert asset["size"] == path.stat().st_size, asset["name"]
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              assert asset.get("digest") == digest, f"Checksum mismatch: {asset['name']}"
          PYVERIFY
          gh release edit "$RELEASE_TAG" --draft=false --latest
