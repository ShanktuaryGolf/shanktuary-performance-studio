name: Build Cross-Platform Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: Shanktuary-Studio-Linux-x64.tar.gz
          - os: windows-latest
            asset_name: Shanktuary-Studio-Windows-x64.zip
          - os: macos-latest
            asset_name: Shanktuary-Studio-macOS-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Executable with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "assets:assets" shanktuary_performance_studio.py

      - name: Build Executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "assets;assets" shanktuary_performance_studio.py

      - name: Compress Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist/shanktuary_performance_studio/* -DestinationPath ${{ matrix.asset_name }}

      - name: Compress Artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf ${{ matrix.asset_name }} -C dist/shanktuary_performance_studio .

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: ${{ matrix.asset_name }}
