name: Build Cross-Platform Standalone Binaries

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_type: linux
            asset_name: Shanktuary-Studio-Linux-x64.tar.gz
          - os: windows-latest
            artifact_type: windows
            asset_name: Shanktuary-Studio-Windows-x64.zip
          - os: macos-latest
            artifact_type: macos
            asset_name: Shanktuary-Studio-macOS.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Executable with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "assets:assets" shanktuary_performance_studio.py

      - name: Build Executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "assets;assets" shanktuary_performance_studio.py

      - name: Package Linux Tarball & AppImage
        if: runner.os == 'Linux'
        run: |
          # 1. Package Tarball
          tar -czf Shanktuary-Studio-Linux-x64.tar.gz -C dist shanktuary_performance_studio
          
          # 2. Package Universal AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/shanktuary_performance_studio/* AppDir/usr/bin/
          cp shanktuary_performance_studio.desktop AppDir/
          cp assets/iron_face.png AppDir/shanktuary_performance_studio.png
          cp assets/iron_face.png AppDir/usr/share/icons/hicolor/256x256/apps/shanktuary_performance_studio.png
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/shanktuary_performance_studio" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Shanktuary-Studio-x86_64.AppImage || true

      - name: Compress Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist/shanktuary_performance_studio -DestinationPath Shanktuary-Studio-Windows-x64.zip

      - name: Compress Artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tar -czf Shanktuary-Studio-macOS.zip -C dist shanktuary_performance_studio

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            Shanktuary-Studio-x86_64.AppImage
          if-no-files-found: warn

      - name: Upload Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            Shanktuary-Studio-x86_64.AppImage
