<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Driving Range</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b141a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(16, 17, 22, 0.88);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 229, 255, 0.35);
            backdrop-filter: blur(10px);
            z-index: 10;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        #hud > * {
            pointer-events: auto;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        #hud h2 {
            margin: 0;
            font-size: 1.15rem;
            color: #00E5FF;
            letter-spacing: 1px;
        }
        #camera-mode-label {
            font-size: 0.82rem;
            color: #8E94A5;
            margin-bottom: 12px;
        }
        
        /* Direct Number Input Target Box */
        .target-control-box {
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.25);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .target-label-row {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.88rem;
            color: #00E5FF;
            margin-bottom: 8px;
        }
        .input-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }
        #target-dist-input {
            background: #101116;
            border: 1px solid #00E5FF;
            color: #00FF66;
            font-family: 'Consolas', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 6px;
            width: 90px;
            text-align: center;
            outline: none;
        }
        #target-dist-input:focus {
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
            border-color: #00FF66;
        }
        .step-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .step-btn:hover {
            background: #00E5FF;
            color: #101116;
        }
        .presets-row {
            display: flex;
            gap: 4px;
            justify-content: space-between;
        }
        .preset-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            padding: 4px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .preset-btn:hover {
            background: #00FF66;
            color: #101116;
            font-weight: 700;
        }
        
        #telemetry-data {
            font-family: 'Consolas', monospace;
            font-size: 0.95rem;
            white-space: pre-wrap;
            color: #00FF66;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.45);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid #00FF66;
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            padding: 8px 14px;
            cursor: pointer;
            background: #00E5FF;
            color: #101116;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            flex: 1;
        }
        .action-btn:hover {
            background: #00FF66;
            transform: translateY(-1px);
        }
        #btn-demo-shot {
            background: #00FF66;
        }
        #btn-demo-shot:hover {
            background: #40C4FF;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="/range/js/three.min.js"></script>
    <script src="/range/js/GLTFLoader.js"></script>
</head>
<body>
    <div id="hud">
        <div class="header-row">
            <h2>🏌️ 3D DRIVING RANGE</h2>
        </div>
        <div id="camera-mode-label">🎥 Cam: Golfer View [V]</div>
        
        <!-- Direct Number Input & Stepper Controls -->
        <div class="target-control-box">
            <div class="target-label-row">
                <span>🎯 TARGET PIN DISTANCE</span>
                <span style="font-size: 0.8rem; color: #8E94A5;">Type or Step</span>
            </div>
            <div class="input-row">
                <input type="number" id="target-dist-input" min="30" max="500" step="1" value="150">
                <button class="step-btn" id="btn-step-minus-10">-10</button>
                <button class="step-btn" id="btn-step-minus-5">-5</button>
                <button class="step-btn" id="btn-step-plus-5">+5</button>
                <button class="step-btn" id="btn-step-plus-10">+10</button>
            </div>
            <div class="presets-row">
                <button class="preset-btn" data-yds="75">75y</button>
                <button class="preset-btn" data-yds="100">100y</button>
                <button class="preset-btn" data-yds="150">150y</button>
                <button class="preset-btn" data-yds="200">200y</button>
                <button class="preset-btn" data-yds="250">250y</button>
                <button class="preset-btn" data-yds="300">300y</button>
            </div>
        </div>

        <div id="telemetry-data">Ready for shot...</div>
        
        <div class="controls">
            <button class="action-btn" id="btn-demo-shot">🚀 DEMO SHOT</button>
            <button class="action-btn" id="btn-cam-switch">🎥 CAM [V]</button>
        </div>
    </div>
    <script type="module" src="/range/js/main.js"></script>
</body>
</html>
