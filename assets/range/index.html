<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Driving Range</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b141a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(16, 17, 22, 0.85);
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            backdrop-filter: blur(8px);
            z-index: 10;
            min-width: 240px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #hud > * {
            pointer-events: auto;
        }
        #hud h2 {
            margin: 0 0 6px 0;
            font-size: 1.1rem;
            color: #00E5FF;
            letter-spacing: 1px;
        }
        #camera-mode-label {
            font-size: 0.85rem;
            color: #8E94A5;
            margin-bottom: 12px;
        }
        #telemetry-data {
            font-family: 'Consolas', monospace;
            font-size: 0.95rem;
            white-space: pre-wrap;
            color: #00FF66;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid #00FF66;
        }
        .controls {
            margin-top: 14px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 14px;
            cursor: pointer;
            background: #00E5FF;
            color: #101116;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #00FF66;
            transform: translateY(-1px);
        }
        #btn-demo-shot {
            background: #00FF66;
        }
        #btn-demo-shot:hover {
            background: #40C4FF;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="/range/js/three.min.js"></script>
    <script src="/range/js/GLTFLoader.js"></script>
</head>
<body>
    <div id="hud">
        <h2>🏌️ 3D DRIVING RANGE</h2>
        <div id="camera-mode-label">🎥 Cam: Golfer View [V]</div>
        <div id="telemetry-data">Ready for shot...</div>
        <div class="controls">
            <button id="btn-demo-shot">🚀 DEMO SHOT</button>
            <button id="btn-cam-switch">🎥 SWITCH CAM [V]</button>
        </div>
    </div>
    <script type="module" src="/range/js/main.js"></script>
</body>
</html>
